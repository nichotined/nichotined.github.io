career-profile:
  title: Background
  summary: |
    I'm a passionate software development enthusiast with over 11 years of experience in software testing,
    specializing in mobile applications — both manual and automated testing. My expertise extends to testing
    web and mobile applications and APIs within complex distributed systems.
    I also have hands-on experience building web applications and APIs using modern technologies such as
    ReactJS, NodeJS, and Golang, and I constantly seek to expand my knowledge and skills.
